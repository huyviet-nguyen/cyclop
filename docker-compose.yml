version: '2.19.1'

services:
  zoo1:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: 127.0.0.1:2888:3888
    networks:
      - mynetwork

  kafka1:
    image: &kafka-image confluentinc/cp-kafka:7.3.2
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_LOG_RETENTION_MS: 2000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
    depends_on:
      - zoo1
    networks:
      - mynetwork
  init-kafka:
    image: *kafka-image
    depends_on:
      - kafka1
    command: ["/bin/bash", "-c", "sleep 10 && /usr/bin/kafka-topics --create --if-not-exists --bootstrap-server kafka1:19092 --replication-factor 1 --partitions 100 --topic kline --config retention.ms=10000 && /usr/bin/kafka-topics --describe --bootstrap-server kafka1:19092 --topic kline "]
    networks:
      - mynetwork
  orderplacer:
    image: [DOCKER_HUB_USERNAME]/tradebot-consumer:latest
    environment:
      - spring.kafka.bootstrap-servers=kafka1:19092
    depends_on:
      - init-kafka
    deploy:
      replicas: 10
    restart: always
    networks:
      - mynetwork

  publisher:
    image: [DOCKER_HUB_USERNAME]/tradebot-publisher:latest
    environment:
      - spring.kafka.bootstrap-servers=kafka1:19092
      - app.runMexc=true
      - app.runBybit=false
    depends_on:
      - init-kafka
    restart: always
    ports:
      - "8081:8081"
    networks:
      - mynetwork

networks:
  mynetwork:
