wss.bybit.url=wss://stream.bybit.com/contract/usdt/public/v3
wss.bybit.initMessageTemplate={"op": "subscribe","args": [%params]}
wss.bybit.pingMessage={"op": "ping", "args": []}
wss.bybit.pingInterval=15
wss.mexc.url=wss://wbs.mexc.com/ws
wss.mexc.initMessageTemplate={"method": "SUBSCRIPTION","params": [%params]}
wss.mexc.pingMessage={"method":"PING"}
wss.mexc.pingInterval=15
kafka.mexc.output.topic=kline-data
kafka.mexc.output.error=mexc-error
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.tbot.cyclop.Cyclop.kafka.serializer.KlineDataSerializer
server.port=8081