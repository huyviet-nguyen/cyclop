apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: docker
      protocol: TCP
      port: 29092
      targetPort: 29092
    - name: jmx
      protocol: TCP
      port: 9999
      targetPort: 9999
