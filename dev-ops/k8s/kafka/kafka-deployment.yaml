apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.3.2
#          resources:
#            requests:
#              memory: "300Mi"
#            limits:
#              memory: "500Mi"
          ports:
            - containerPort: 9092
            - containerPort: 29092
            - containerPort: 9999
          command:
            - "bash"
            - "-c"
            - >
              unset KAFKA_PORT && /etc/confluent/docker/run
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://127.0.0.1:19092,EXTERNAL://kafka:9092,DOCKER://host.docker.internal:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_LOG4J_LOGGERS
              value: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_JMX_PORT
              value: "9999"
            - name: KAFKA_JMX_HOSTNAME
              value: ${DOCKER_HOST_IP:-127.0.0.1}
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: kafka.security.authorizer.AclAuthorizer
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "true"
            - name: KAFKA_LOG_RETENTION_MS
              value: "2000"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "1000"
      restartPolicy: Always
