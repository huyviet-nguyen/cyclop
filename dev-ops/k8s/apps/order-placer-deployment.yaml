apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderplacer
spec:
  replicas: 30
  selector:
    matchLabels:
      app: orderplacer
  template:
    metadata:
      labels:
        app: orderplacer
    spec:
      containers:
        - name: orderplacer
          image: [AWS_ACCOUNT_ID].dkr.ecr.ap-southeast-2.amazonaws.com/[ECR_REPO_NAME]-order-placer:latest
          env:
            - name: spring.kafka.bootstrap-servers
              value: "kafka:9092"